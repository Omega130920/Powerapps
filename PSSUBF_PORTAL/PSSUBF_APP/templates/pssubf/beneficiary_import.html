{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Import | PSSUBF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --glass-bg: rgba(255, 255, 255, 0.25); --glass-border: rgba(255, 255, 255, 0.3); --text-dark: #1b5e20; --accent-green: #43a047; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #d1e2c4 0%, #8fcf7f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-custom { max-width: 600px; width: 100%; padding: 40px; background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .drop-zone { border: 2px dashed var(--glass-border); border-radius: 15px; padding: 40px; background: rgba(255,255,255,0.1); cursor: pointer; text-align: center; transition: 0.3s; }
        .drop-zone:hover { background: rgba(255,255,255,0.2); border-color: var(--accent-green); }
        .btn-sync { background: var(--accent-green); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: 700; margin-top: 20px; }
    </style>
</head>
<body>
<div class="card-custom text-center">
    <h3 class="fw-bold mb-4">Sync Master Database</h3>
    {% if messages %}{% for m in messages %}<div class="alert alert-info py-2 small">{{ m }}</div>{% endfor %}{% endif %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <i class="bi bi-file-earmark-spreadsheet fs-1 text-success"></i>
            <p class="mt-2 small text-muted" id="fileName">Select Excel File (.xlsx)</p>
            <input type="file" id="fileInput" name="file" hidden onchange="document.getElementById('fileName').innerText = this.files[0].name">
        </div>
        <button type="submit" class="btn-sync">Perform Import</button>
    </form>
    <a href="{% url 'beneficiary_list' %}" class="d-block mt-3 text-success text-decoration-none small fw-bold">Return to List</a>
</div>
</body>
</html>
