{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Lead: {{ lead.company_name }}</title>
    <style>
        /* --- Root Colors (Consistent Professional Palette) --- */
        :root {
            --primary-green: #4CAF50;
            --accent-green: #2e7d32;
            --bg-light-green: #f1f8e9;
            --text-default: #2c3e50;
            --text-muted: #7f8c8d;
            --action-blue: #0070c0;
            --border-light: #dcdde1;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* --- Body & Layout --- */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
            color: var(--text-default);
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* --- Typography & Navigation --- */
        h1 {
            color: var(--action-blue);
            border-bottom: 4px solid var(--bg-light-green);
            padding-bottom: 20px;
            margin-bottom: 40px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 30px;
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .back-link:hover { color: var(--primary-green); transform: translateX(-4px); }

        /* --- Form Grid System --- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .form-group {
            margin-bottom: 5px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }

        /* --- Inputs & Labels --- */
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: #576574;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"], input[type="email"], input[type="date"], input[type="number"], select, textarea {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fdfdfd;
            transition: all 0.2s ease;
            color: var(--text-default);
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--action-blue);
            box-shadow: 0 0 0 4px rgba(0, 112, 192, 0.1);
            outline: none;
            background-color: #fff;
        }

        /* --- Buttons --- */
        .save-button {
            background-color: var(--primary-green);
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 40px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
            width: 100%;
        }
        .save-button:hover { 
            background-color: var(--accent-green); 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.4);
        }

        /* --- Alert Messages --- */
        .messages {
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
        }
        .messages li {
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            font-weight: 600;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .messages li.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-left: 5px solid #4caf50;
        }
        .messages li.error {
            background-color: #ffebee;
            color: #c62828;
            border-left: 5px solid #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'lead_info' lead_id=lead.id %}" class="back-link">
            <svg style="width:18px;height:18px;margin-right:8px;vertical-align:middle" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Lead Details
        </a>

        <h1>Editing Lead: {{ lead.company_name }}</h1>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" action="{% url 'edit_lead' lead_id=lead.id %}">
            {% csrf_token %}
            <div class="form-grid">

                <div class="form-group">
                    <label for="company_name">Company Name*</label>
                    <input type="text" id="company_name" name="company_name" value="{{ lead.company_name }}" required>
                </div>
                <div class="form-group">
                    <label for="lead_received_from">Lead Received From</label>
                    <input type="text" id="lead_received_from" name="lead_received_from" value="{{ lead.lead_received_from|default:'' }}">
                </div>
                <div class="form-group">
                    <label for="date_received">Date Received</label>
                    <input type="date" id="date_received" name="date_received" value="{{ date_received_str }}">
                </div>

                <div class="form-group">
                    <label for="contact_person">Contact Person</label>
                    <input type="text" id="contact_person" name="contact_person" value="{{ lead.contact_person|default:'' }}">
                </div>
                <div class="form-group">
                    <label for="contact_number">Contact Number</label>
                    <input type="text" id="contact_number" name="contact_number" value="{{ lead.contact_number|default:'' }}">
                </div>
                <div class="form-group">
                    <label for="contact_email">Contact Email</label>
                    <input type="email" id="contact_email" name="contact_email" value="{{ lead.contact_email|default:'' }}">
                </div>

                <div class="form-group">
                    <label for="product_required">Product Required</label>
                    <select id="product_required" name="product_required">
                        {% for product in product_options %}
                            <option value="{{ product }}" {% if product == lead.product_required %}selected{% endif %}>{{ product }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="assigned_to">Assigned To</label>
                    <select id="assigned_to" name="assigned_to">
                        {% for consultant in consultant_options %}
                            <option value="{{ consultant }}" {% if consultant == lead.assigned_to %}selected{% endif %}>{{ consultant }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Status*</label>
                    <select id="status" name="status" required>
                        {% for status in status_options %}
                            <option value="{{ status }}" {% if status == lead.status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="date_accepted">Date Accepted</label>
                    <input type="date" id="date_accepted" name="date_accepted" value="{{ date_accepted_str }}">
                </div>
                <div class="form-group">
                    <label for="start_date">Start Date (Projection)</label>
                    <input type="date" id="start_date" name="start_date" value="{{ start_date_str }}">
                </div>

            </div>
            
            <button type="submit" class="save-button">Save Lead Updates</button>
        </form>
    </div>
</body>
</html>
