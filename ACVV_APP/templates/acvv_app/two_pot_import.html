<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Two-Pot Claims</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to bottom, #d1e2c4, rgb(143, 207, 127));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .upload-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .upload-card h2 {
            color: #1b5e20;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .upload-card p {
            color: #555;
            margin-bottom: 30px;
        }

        /* Form Styling */
        .file-input-wrapper {
            margin-bottom: 25px;
            text-align: left;
        }

        .file-input-wrapper input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            border: 2px dashed #8fcf7f;
            border-radius: 6px;
            background-color: #f9fbf9;
            color: #333;
            cursor: pointer;
        }

        .submit-btn {
            background-color: rgb(119, 206, 97);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s;
        }

        .submit-btn:hover {
            background-color: rgb(105, 187, 85);
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Django Messages Styling */
        .messages {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
            text-align: left;
        }

        .messages li {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .messages li.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .messages li.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="upload-card">
        <h2><i class="fas fa-file-import"></i> Two-Pot Import</h2>
        <p>Upload your Excel (.xlsx) or CSV file containing the Two-Pot claims.</p>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST" action="{% url 'import_two_pot_claims' %}" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="file-input-wrapper">
                <input type="file" name="claim_upload" accept=".csv, .xlsx, .xls" required>
            </div>
            
            <button type="submit" class="submit-btn">
                <i class="fas fa-cloud-upload-alt"></i> Run Import
            </button>
        </form>

        <a href="{% url 'acvv_list' %}" class="back-link">← Back to Dashboard</a>
    </div>

</body>
</html>
